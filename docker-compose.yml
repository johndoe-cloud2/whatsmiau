# Local stack: igual que en producción (router + backend + redis).
# Probar todo: make test-stack   o: ./scripts/test-stack.sh
services:
  router:
    build:
      context: .
      dockerfile: Dockerfile.router
    container_name: whatsmiau-router
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_URL: redis:6379
      API_SECRET: local-secret
      API_SECRET_HEADER: X-Api-Secret
    depends_on:
      - redis
    restart: unless-stopped

  whatsmiau:
    build: .
    container_name: whatsmiau
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      REDIS_URL: redis:6379
      DIALECT_DB: sqlite3
      DB_URL: file:/app/data/data.db?_foreign_keys=on
      WEBHOOK_URL: ""
      BACKEND_PUBLIC_URL: http://whatsmiau:8080
    volumes:
      - whatsmeow:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Optional: Postgres (use when DIALECT_DB=postgres and DB_URL=postgres://...)
  db:
    image: postgres:latest
    container_name: postgres
    profiles:
      - with-postgres
    volumes:
      - pg-data:/pg-data
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsmiau
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: whatsmiau

volumes:
  redis-data:
    driver: local
  whatsmeow:
    driver: local
  pg-data:
    driver: local
