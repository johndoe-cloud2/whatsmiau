AWSTemplateFormatVersion: "2010-09-09"
Description: Whatsmiau - Single API with Router, Redis, ECS backends (min capacity, 1 instance; scales on CPU/RAM >80%)

Parameters:
  ApiKey:
    Type: String
    NoEcho: true
    Description: API key for auth (header apikey); used by router and backend
  WebhookURL:
    Type: String
    Description: Webhook URL for backend events (each backend sends events here)
  BackendImage:
    Type: String
    Description: ECR image URI for whatsmiau backend
  RouterImage:
    Type: String
    Description: ECR image URI for router
  RedisNodeType:
    Type: String
    Default: cache.t3.micro
    Description: ElastiCache node type
  VpcId:
    Type: String
    Default: ""
    Description: "(Optional) Existing VPC ID. If set, PublicSubnetIds and PrivateSubnetIds are required; no new VPC is created."
  PublicSubnetIds:
    Type: String
    Default: ""
    Description: "Comma-separated public subnet IDs (min 2) for ALB and router. Required if VpcId is set."
  PrivateSubnetIds:
    Type: String
    Default: ""
    Description: "Comma-separated private subnet IDs (min 2) for backend and Redis. Required if VpcId is set."

Conditions:
  CreateVpc: !Equals [!Ref VpcId, ""]
  UseExistingVpc: !Not [!Equals [!Ref VpcId, ""]]

Resources:
  VPC:
    Condition: CreateVpc
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
  AttachIGW:
    Condition: CreateVpc
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Condition: CreateVpc
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  PublicSubnet2:
    Condition: CreateVpc
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PrivateSubnet1:
    Condition: CreateVpc
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
  PrivateSubnet2:
    Condition: CreateVpc
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  NatEIP:
    Condition: CreateVpc
    Type: AWS::EC2::EIP
    DependsOn: AttachIGW
    Properties:
      Domain: vpc
  NatGateway:
    Condition: CreateVpc
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  PublicRouteTable:
    Condition: CreateVpc
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PublicRoute:
    Condition: CreateVpc
    Type: AWS::EC2::Route
    DependsOn: AttachIGW
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1RouteAssoc:
    Condition: CreateVpc
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  PublicSubnet2RouteAssoc:
    Condition: CreateVpc
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Condition: CreateVpc
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PrivateRoute:
    Condition: CreateVpc
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateSubnet1RouteAssoc:
    Condition: CreateVpc
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable
  PrivateSubnet2RouteAssoc:
    Condition: CreateVpc
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Security groups
  ALBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB
      VpcId: !If [CreateVpc, !Ref VPC, !Ref VpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
  RouterSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Router
      VpcId: !If [CreateVpc, !Ref VPC, !Ref VpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSG
  BackendSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend
      VpcId: !If [CreateVpc, !Ref VPC, !Ref VpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref RouterSG
  RedisSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis
      VpcId: !If [CreateVpc, !Ref VPC, !Ref VpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref RouterSG
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref BackendSG

  # VPC endpoints for ECR (when using existing VPC without NAT, so tasks can pull images)
  VPCEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Condition: UseExistingVpc
    Properties:
      GroupDescription: VPC endpoints for ECR
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref BackendSG
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref RouterSG

  VPCEndpointECRAPI:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseExistingVpc
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", !Ref PublicSubnetIds]
      SecurityGroupIds:
        - !Ref VPCEndpointSG

  VPCEndpointECRDKR:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseExistingVpc
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", !Ref PublicSubnetIds]
      SecurityGroupIds:
        - !Ref VPCEndpointSG

  VPCEndpointLogs:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseExistingVpc
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [",", !Ref PublicSubnetIds]
      SecurityGroupIds:
        - !Ref VPCEndpointSG

  # ElastiCache Redis
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Redis subnet group
      SubnetIds: !If
        - CreateVpc
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
        - !Split [",", !Ref PrivateSubnetIds]
  Redis:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      CacheNodeType: !Ref RedisNodeType
      Engine: redis
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds:
        - !Ref RedisSG

  # ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub whatsmiau-${AWS::StackName}
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  RouterTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: whatsmiau-router
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: router
          Image: !Ref RouterImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RouterLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: PORT
              Value: "8080"
            - Name: REDIS_URL
              Value: !Sub
                - "${Address}:6379"
                - Address: !GetAtt Redis.RedisEndpoint.Address
            - Name: API_KEY
              Value: !Ref ApiKey
  RouterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/whatsmiau-router-${AWS::StackName}
      RetentionInDays: 7

  BackendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: whatsmiau-backend
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: PORT
              Value: "8080"
            - Name: REDIS_URL
              Value: !Sub
                - "${Address}:6379"
                - Address: !GetAtt Redis.RedisEndpoint.Address
            - Name: WEBHOOK_URL
              Value: !Ref WebhookURL
            - Name: DIALECT_DB
              Value: sqlite3
            - Name: DB_URL
              Value: file:/app/data/data.db?_foreign_keys=on
            - Name: API_KEY
              Value: !Ref ApiKey
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/whatsmiau-backend-${AWS::StackName}
      RetentionInDays: 7

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !If
        - CreateVpc
        - [!Ref PublicSubnet1, !Ref PublicSubnet2]
        - !Split [",", !Ref PublicSubnetIds]
      SecurityGroups:
        - !Ref ALBSG

  RouterTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8080
      Protocol: HTTP
      VpcId: !If [CreateVpc, !Ref VPC, !Ref VpcId]
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200-399

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref RouterTargetGroup

  RouterService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: whatsmiau-router
      Cluster: !Ref Cluster
      TaskDefinition: !Ref RouterTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !If
            - CreateVpc
            - [!Ref PublicSubnet1, !Ref PublicSubnet2]
            - !Split [",", !Ref PublicSubnetIds]
          SecurityGroups:
            - !Ref RouterSG
      LoadBalancers:
        - TargetGroupArn: !Ref RouterTargetGroup
          ContainerName: router
          ContainerPort: 8080

  BackendService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: whatsmiau-backend
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BackendTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !If
            - CreateVpc
            - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
            - !Split [",", !Ref PublicSubnetIds]
          SecurityGroups:
            - !Ref BackendSG

  BackendScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: BackendService
    Properties:
      MaxCapacity: 10
      MinCapacity: 1
      ResourceId: !Sub service/whatsmiau-${AWS::StackName}/whatsmiau-backend
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  BackendScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: whatsmiau-backend-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BackendScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 80.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
  BackendScalingPolicyMemory:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: whatsmiau-backend-memory
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BackendScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: 80.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

Outputs:
  APIEndpoint:
    Description: Public API endpoint (router)
    Value: !Sub http://${ALB.DNSName}
    Export:
      Name: !Sub ${AWS::StackName}-APIEndpoint
  RedisEndpoint:
    Description: Redis primary endpoint
    Value: !Sub
      - "${Address}:6379"
      - Address: !GetAtt Redis.RedisEndpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-RedisEndpoint
